<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2EDE4" />
    <title>Robin Liu · 3D 西洋棋作品集</title>
    <meta
      name="description"
      content="Robin Liu 的作品集,以低多邊形 3D 西洋棋呈現:把棋子拖到定位、將殺對手,就能解鎖內容。A portfolio played as a low-poly 3D chess board: checkmate to unlock."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Robin Liu · 3D 西洋棋作品集" />
    <meta
      property="og:description"
      content="把棋子拖到定位、將殺對手,就能解鎖內容。Checkmate to unlock."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Critical styles only: the rest lives in src/styles.css. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f2ede4;
        color: #3a3532;
        font-family: ui-rounded, 'SF Pro Rounded', 'Noto Sans TC', 'PingFang TC',
          'Microsoft JhengHei', system-ui, sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 14px;
        letter-spacing: 0.08em;
        color: #8c7560;
        transition: opacity 0.4s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" role="status">載入棋盤中… Loading board…</div>
    <noscript>
      <p style="position: fixed; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; background: #f2ede4">
        這個網站是一盤 3D 西洋棋,需要啟用 JavaScript 與 WebGL。<br />
        This site is a 3D chess board and needs JavaScript and WebGL.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
