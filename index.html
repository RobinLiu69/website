<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C0C0F" />
    <title>…</title>
    <meta
      name="description"
      content="一盤棋,藏著一些東西。 A chessboard, hiding something."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="…" />
    <meta
      property="og:description"
      content="一盤棋,藏著一些東西。 A chessboard, hiding something."
    />
    <!--social-image-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The handwriting fonts are added by src/main.ts once the page is running; until then system fonts stand in. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      /* Critical styles only: the rest lives in src/styles.css. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0c0f;
        color: #ece8df;
        font-family: 'LXGW WenKai TC', 'Klee One', 'Kaiti TC', 'BiauKai', 'PingFang TC', 'Noto Sans TC',
          'Microsoft JhengHei', ui-rounded, system-ui, sans-serif;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 22px;
        letter-spacing: 0.5em;
        color: #6f6c66;
        transition: opacity 0.4s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" role="status" aria-label="Loading">· · ·</div>
    <noscript>
      <p style="position: fixed; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; background: #0c0c0f; color: #ece8df">
        這裡有一盤棋,需要 JavaScript 與 WebGL 才看得到。<br />
        There is a chessboard here. It needs JavaScript and WebGL.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
